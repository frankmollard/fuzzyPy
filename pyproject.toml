[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzyfier"
version = "0.1.0"
description = "Fuzzification and defuzzification of ordinal data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Frank Mollard" }
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "gitpython>=3.1"
]
test = [
    "pytest>=8.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
